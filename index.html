<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>八雲台 バス案内</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0e1a; --surface:#111827; --accent:#00d4ff; --accent3:#7fff00; --text:#e8f4f8; --text-dim:#6b8299; --border:rgba(0,212,255,0.15); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:rgba(10,14,26,.95);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
  .header-left{display:flex;align-items:center;gap:10px;}
  .bus-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#0080ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .stop-name{font-size:20px;font-weight:900;letter-spacing:.05em;}
  .stop-ruby{font-size:10px;color:var(--text-dim);letter-spacing:.15em;}
  .clock{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--accent);letter-spacing:.1em;text-align:right;}
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
  .tab{flex:0 0 25%;min-width:82px;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:all .2s;border-bottom:3px solid transparent;letter-spacing:.02em;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(0,212,255,.05);}
  .tab.odakyu.active{color:#ffa000;border-bottom-color:#ffa000;background:rgba(255,160,0,.05);}
  .op-badge{font-size:9px;padding:1px 4px;border-radius:3px;margin-right:2px;display:inline-block;}
  .op-keio{background:rgba(0,212,255,.2);color:var(--accent);}
  .op-odakyu{background:rgba(255,160,0,.2);color:#ffa000;}
  .hero{margin:16px 14px 10px;background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(0,128,255,.05));border:1px solid var(--accent);border-radius:16px;padding:18px;position:relative;overflow:hidden;}
  .hero.odakyu-hero{border-color:#ffa000;background:linear-gradient(135deg,rgba(255,160,0,.08),rgba(255,100,0,.04));}
  .hero::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:radial-gradient(circle,rgba(0,212,255,.12),transparent 70%);border-radius:50%;}
  .hero-label{font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;opacity:.8;}
  .hero-label.odakyu-label{color:#ffa000;}
  .hero-route{font-size:12px;color:var(--text-dim);margin-bottom:3px;}
  .hero-destination{font-size:20px;font-weight:900;margin-bottom:14px;}
  .countdown-wrap{display:flex;align-items:baseline;gap:5px;}
  .countdown-num{font-family:'Share Tech Mono',monospace;font-size:68px;font-weight:700;line-height:1;color:var(--accent);text-shadow:0 0 30px rgba(0,212,255,.5);transition:color .3s;}
  .countdown-num.urgent{color:#ff6b35;text-shadow:0 0 30px rgba(255,107,53,.6);animation:pulse 1s ease-in-out infinite;}
  .countdown-num.odakyu-color{color:#ffa000;text-shadow:0 0 30px rgba(255,160,0,.5);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .countdown-unit{font-size:16px;font-weight:700;color:var(--text-dim);}
  .depart-time{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--text-dim);margin-top:8px;}
  .depart-time span{color:var(--text);}
  .progress-bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:14px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#0080ff);border-radius:2px;transition:width 1s linear;}
  .progress-fill.odakyu-fill{background:linear-gradient(90deg,#ffa000,#ff6600);}
  .arrived-tag{background:rgba(127,255,0,.15);color:var(--accent3);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.1em;}
  .section-title{font-size:10px;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;padding:14px 14px 6px;}
  .bus-list{padding:0 14px;display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .bus-card{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;gap:11px;animation:slideIn .3s ease both;}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .card-badge{width:36px;height:36px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;font-weight:700;letter-spacing:.04em;}
  .badge-cho{background:rgba(0,212,255,.15);color:var(--accent);border:1px solid rgba(0,212,255,.3);}
  .badge-taka{background:rgba(127,255,0,.12);color:var(--accent3);border:1px solid rgba(127,255,0,.25);}
  .badge-yoshi{background:rgba(255,160,0,.15);color:#ffa000;border:1px solid rgba(255,160,0,.3);}
  .badge-taka61{background:rgba(255,80,80,.13);color:#ff6060;border:1px solid rgba(255,80,80,.25);}
  .card-info{flex:1;min-width:0;}
  .card-dest{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-route{font-size:10px;color:var(--text-dim);margin-top:1px;}
  .card-time-block{text-align:right;flex-shrink:0;}
  .card-depart{font-family:'Share Tech Mono',monospace;font-size:17px;font-weight:700;}
  .card-remaining{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;}
  .card-remaining.soon{color:#ff6b35;font-weight:700;}
  .no-bus{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;}
  .rt-banner{margin:0 14px 4px;padding:8px 12px;border-radius:10px;font-size:11px;display:flex;align-items:center;gap:8px;font-weight:700;}
  .rt-banner.rt-active{background:rgba(127,255,0,.1);border:1px solid rgba(127,255,0,.25);color:var(--accent3);}
  .rt-banner.rt-inactive{background:rgba(107,130,153,.1);border:1px solid rgba(107,130,153,.2);color:var(--text-dim);}
  .rt-banner.rt-error{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.2);color:#ff8080;}
  .rt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .rt-dot.live{background:var(--accent3);box-shadow:0 0 6px var(--accent3);animation:blink 1.5s ease-in-out infinite;}
  .rt-dot.off{background:var(--text-dim);}
  .rt-dot.err{background:#ff8080;}
  .delay-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px;}
  .delay-late{background:rgba(255,107,53,.2);color:#ff6b35;}
  .delay-early{background:rgba(127,255,0,.15);color:var(--accent3);}
  .delay-ontime{background:rgba(0,212,255,.12);color:var(--accent);}
  .rt-updated{font-size:9px;color:var(--text-dim);margin-left:auto;font-weight:400;}
  .setup-banner{margin:12px 14px;padding:14px;background:rgba(255,160,0,.08);border:1px solid rgba(255,160,0,.3);border-radius:12px;font-size:12px;line-height:1.7;}
  .setup-banner a{color:#ffa000;}
  .setup-banner code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:11px;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:blink 2s ease-in-out infinite;display:inline-block;margin-right:4px;vertical-align:middle;}
  .footer{text-align:center;padding:18px 14px;font-size:10px;color:var(--text-dim);letter-spacing:.1em;border-top:1px solid var(--border);margin-top:8px;}
</style>
</head>

const WORKER_URL = ""; // 例: "https://keio-proxy.yourname.workers.dev"

// 八雲台バス停に関係する路線・方向（GTFS route_id）
// 実際のroute_idはGTFSデータで確認が必要（暫定値）
const YAKUMODAI_ROUTES = {
  '調34': ['chofu34', 'Cho34', '調布34', '調34'],
  '鷹66': ['taka66', 'Taka66', '鷹66'],
};

let rtData = {
  delays: {}, // { "trip_id": delaySeconds }
  vehicles: {}, // { "trip_id": { lat, lon, timestamp } }
  lastFetch: 0,
  status: 'off', // 'off' | 'live' | 'error'
};

async function fetchRealtime() {
  if (!WORKER_URL) {
    document.getElementById('rt-banner').style.display = 'none';
    document.getElementById('setup-msg').style.display = 'block';
    return;
  }
  document.getElementById('rt-banner').style.display = 'flex';
  document.getElementById('setup-msg').style.display = 'none';

  try {
    // GTFS-RT はprotobufバイナリなので、JSONで返すworkerを使う場合はそちらに対応
    // ここではworkerがJSONに変換して返す前提でシンプルに実装
    const res = await fetch(`${WORKER_URL}?type=vehicle`, {
      signal: AbortSignal.timeout(8000)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // WorkerがJSONを返す場合（protobuf→JSON変換済み）
    const json = await res.json();
    const entities = json.entity || json.entities || [];

    const newDelays = {};
    const newVehicles = {};

    for (const entity of entities) {
      const tu = entity.tripUpdate || entity.trip_update;
      const vp = entity.vehicle;

      if (tu) {
        const tripId = tu.trip?.tripId || tu.trip?.trip_id;
        const stu = tu.stopTimeUpdate || tu.stop_time_update || [];
        if (tripId && stu.length > 0) {
          const latest = stu[stu.length - 1];
          const delay = latest.departure?.delay || latest.arrival?.delay || 0;
          newDelays[tripId] = delay;
        }
      }
      if (vp) {
        const tripId = vp.trip?.tripId || vp.trip?.trip_id;
        if (tripId && vp.position) {
          newVehicles[tripId] = {
            lat: vp.position.latitude,
            lon: vp.position.longitude,
            ts: vp.timestamp,
          };
        }
      }
    }

    rtData.delays = newDelays;
    rtData.vehicles = newVehicles;
    rtData.lastFetch = Date.now();
    rtData.status = 'live';
    updateRtBanner('live', `${Object.keys(newVehicles).length}台追跡中`);
  } catch (e) {
    rtData.status = 'error';
    updateRtBanner('error', 'リアルタイム取得失敗');
    console.warn('RT fetch failed:', e);
  }
}

function updateRtBanner(status, msg) {
  const banner = document.getElementById('rt-banner');
  const dot = document.getElementById('rt-dot');
  const statusEl = document.getElementById('rt-status');
  const updatedEl = document.getElementById('rt-updated');
  banner.className = `rt-banner rt-${status === 'live' ? 'active' : status === 'error' ? 'error' : 'inactive'}`;
  dot.className = `rt-dot ${status === 'live' ? 'live' : status === 'error' ? 'err' : 'off'}`;
  statusEl.textContent = status === 'live' ? `🛰 LIVE · ${msg}` : `${msg}`;
  if (status === 'live') {
    const d = new Date();
    updatedEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}更新`;
  }
}

  // ここでは遅延があるtripのうち発車時刻が近いものを推定マッチ
  if (Object.keys(rtData.delays).length === 0) return null;
  // 簡易マッチ: 発車時刻±3分以内のdelayを返す（暫定）

}

function dayType(){const d=new Date(),w=d.getDay();return w===0?'holiday':w===6?'saturday':'weekday';}
function dayLabel(){const d=new Date(),w=d.getDay();return w===0?'日曜・祝日ダイヤ':w===6?'土曜ダイヤ':'平日ダイヤ';}
function pad(n){return String(n).padStart(2,'0');}
function fmt(h,m){return `${pad(h)}:${pad(m)}`;}

function getBadge(r){
  if(r.includes('吉'))return 'badge-yoshi';
  if(r.includes('鷹６１'))return 'badge-taka61';
  if(r.includes('調'))return 'badge-cho';
  return 'badge-taka';
}

function getSched(){
  const buses=TT[currentDir][dayType()];
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  return buses.map(([h,m,r,d])=>({h,m,r,d,dep:h*60+m,diff:h*60+m-nm}))
    .filter(b=>b.diff>-2).sort((a,b)=>a.dep-b.dep);
}

function setDir(d){
  // 0→小急① (TT[3]), 1→小急② (TT[4]), 2→京王① (TT[1]), 3→京王② (TT[2])
  const map=[3,4,1,2];
  currentDir=map[d];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===d));
  render();
}

function render(){
  const now=new Date();
  document.getElementById('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('dayLabel').textContent=dayLabel();
  const sched=getSched(), app=document.getElementById('app');
  if(!sched.length){app.innerHTML='<div class="no-bus">🌙 本日の運行は終了しました</div>';return;}
  const next=sched[0], up=sched.slice(1,6), od=currentDir>=3;
  const ns=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const ds=next.h*3600+next.m*60, rem=Math.max(0,ds-ns), rm=Math.floor(rem/60), rs=rem%60;
  const urg=rm<3, pp=Math.max(0,Math.min(100,(1-rem/900)*100));
  const nc=urg?'countdown-num urgent':od?'countdown-num odakyu-color':'countdown-num';
  let cnt;
  if(rem<=0)cnt=`<span class="arrived-tag">まもなく到着</span>`;
  else if(rm===0)cnt=`<div class="countdown-wrap"><span class="${nc}">${rs}</span><span class="countdown-unit">秒</span></div>`;
  else cnt=`<div class="countdown-wrap"><span class="${nc}">${rm}</span><span class="countdown-unit">分${pad(rs)}秒</span></div>`;
  const upH=up.map((b,i)=>`
    <div class="bus-card" style="animation-delay:${i*.06}s">
      <div class="card-badge ${getBadge(b.r)}">${b.r}</div>
      <div class="card-info"><div class="card-dest">${b.d}</div><div class="card-route">${b.r}系統</div></div>
      <div class="card-time-block">
        <div class="card-depart">${fmt(b.h,b.m)}</div>
        <div class="card-remaining${b.diff<=5?' soon':''}">あと約${b.diff}分</div>
      </div>
    </div>`).join('');
  app.innerHTML=`
    <div class="${od?'hero odakyu-hero':'hero'}">
      <div class="${od?'hero-label odakyu-label':'hero-label'}">▶ 次のバス</div>
      <div class="hero-route">${next.r}系統</div>
      <div class="hero-destination">${next.d}</div>
      ${cnt}
      <div class="depart-time">発車予定：<span>${fmt(next.h,next.m)}</span></div>
      <div class="progress-bar"><div class="${od?'progress-fill odakyu-fill':'progress-fill'}" style="width:${pp}%"></div></div>
    </div>
    <div class="section-title">今後のバス</div>
    <div class="bus-list">${upH||'<div style="color:var(--text-dim);font-size:13px;padding:8px 0">本日の運行はこれで終わりです</div>'}</div>`;
}
render();setInterval(render,1000);

// リアルタイム: 30秒ごとに取得

}
</script>
