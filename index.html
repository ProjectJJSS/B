<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>八雲台 バス</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #0b0f1c;
  --panel: #111827;
  --panel2: #1a2234;
  --accent-keio: #00d4ff;
  --accent-odakyu: #ff9500;
  --text: #f0f6ff;
  --dim: #5a7a99;
  --border: rgba(255,255,255,0.07);
  --green: #4ade80;
  --red: #f87171;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Noto Sans JP', sans-serif; color: var(--text); }

/* ── LAYOUT ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

/* ── TOP PANEL (25%) ── */
#top-panel {
  flex: 0 0 auto;
  height: 25%;
  min-height: 140px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 10;
}

/* header strip */
.header-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px 6px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.stop-label {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.stop-name-big { font-size: 18px; font-weight: 900; letter-spacing: .04em; }
.stop-ruby { font-size: 10px; color: var(--dim); letter-spacing: .15em; }
.clock-mono {
  font-family: 'DM Mono', monospace;
  font-size: 17px;
  color: var(--accent-keio);
  letter-spacing: .08em;
}
.day-chip {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 20px;
  background: rgba(255,255,255,.07);
  color: var(--dim);
  font-weight: 700;
  letter-spacing: .05em;
  margin-top: 1px;
}

/* tab row */
.tab-row {
  display: flex;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1;
  padding: 6px 4px 5px;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  cursor: pointer;
  transition: all .2s;
  border-bottom: 2px solid transparent;
  position: relative;
}
.tab.active-k { color: var(--accent-keio); border-bottom-color: var(--accent-keio); background: rgba(0,212,255,.04); }
.tab.active-o { color: var(--accent-odakyu); border-bottom-color: var(--accent-odakyu); background: rgba(255,149,0,.04); }
.op-chip {
  display: inline-block;
  font-size: 8px;
  padding: 1px 3px;
  border-radius: 3px;
  margin-right: 2px;
  font-weight: 900;
}
.ck { background: rgba(0,212,255,.18); color: var(--accent-keio); }
.co { background: rgba(255,149,0,.18); color: var(--accent-odakyu); }

/* next-bus hero */
.next-bus-row {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 12px;
  overflow: hidden;
}
.route-badge {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
  flex-shrink: 0;
  letter-spacing: .02em;
}
.rb-keio { background: rgba(0,212,255,.15); border: 1.5px solid rgba(0,212,255,.4); color: var(--accent-keio); }
.rb-odakyu { background: rgba(255,149,0,.15); border: 1.5px solid rgba(255,149,0,.4); color: var(--accent-odakyu); }
.rb-green { background: rgba(74,222,128,.15); border: 1.5px solid rgba(74,222,128,.4); color: var(--green); }
.rb-red { background: rgba(248,113,113,.15); border: 1.5px solid rgba(248,113,113,.4); color: var(--red); }

.next-info { flex: 1; min-width: 0; }
.next-dest { font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-route { font-size: 10px; color: var(--dim); margin-top: 1px; }
.next-countdown {
  text-align: right;
  flex-shrink: 0;
}
.cnt-num {
  font-family: 'DM Mono', monospace;
  font-size: 42px;
  font-weight: 500;
  line-height: 1;
  transition: color .3s;
}
.cnt-num.keio-col { color: var(--accent-keio); }
.cnt-num.odakyu-col { color: var(--accent-odakyu); }
.cnt-num.urgent-col { color: var(--red); animation: throb .8s ease-in-out infinite; }
.cnt-unit { font-size: 11px; color: var(--dim); font-weight: 700; }
.cnt-depart { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--dim); margin-top: 2px; }

/* delay tag */
.delay-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 5px;
}
.dl-late { background: rgba(248,113,113,.2); color: var(--red); }
.dl-early { background: rgba(74,222,128,.2); color: var(--green); }
.dl-ontime { background: rgba(0,212,255,.15); color: var(--accent-keio); }

@keyframes throb { 0%,100%{opacity:1} 50%{opacity:.5} }

/* ── MAP (75%) ── */
#map-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#map { width: 100%; height: 100%; }

/* map overlays */
.map-overlay-tl {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 800;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.map-pill {
  background: rgba(11,15,28,.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 5px;
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: blink 1.5s ease-in-out infinite;
}
.demo-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-odakyu);
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* upcoming bottom sheet */
#bottom-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 800;
  background: linear-gradient(to top, rgba(11,15,28,.97) 70%, transparent);
  padding: 20px 14px 14px;
}
.upcoming-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.upcoming-row::-webkit-scrollbar { display: none; }
.upcoming-card {
  flex: 0 0 auto;
  background: rgba(26,34,52,.9);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 11px;
  min-width: 100px;
}
.uc-time { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; }
.uc-dest { font-size: 10px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.uc-min { font-size: 10px; font-weight: 700; margin-top: 3px; }

/* Leaflet custom bus icon wrapper */
.bus-icon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.bus-icon-emoji {
  font-size: 24px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
  animation: bounceY .9s ease-in-out infinite alternate;
}
@keyframes bounceY { from{transform:translateY(0)} to{transform:translateY(-4px)} }
.bus-icon-label {
  background: rgba(0,212,255,.9);
  color: #000;
  font-size: 9px;
  font-weight: 900;
  padding: 1px 5px;
  border-radius: 8px;
  white-space: nowrap;
}
.bus-icon-label.od { background: rgba(255,149,0,.9); }
.bus-icon-label.arriving { background: rgba(248,113,113,.9); animation: throb .8s ease-in-out infinite; }

/* stop icon */
.stop-pin {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.stop-pin-circle {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent-keio);
  box-shadow: 0 0 0 3px rgba(0,212,255,.3);
}
.stop-pin-label {
  background: rgba(11,15,28,.9);
  color: var(--text);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  margin-top: 3px;
  border: 1px solid var(--border);
  white-space: nowrap;
}

/* you-pin */
.you-pin {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--green);
  border: 3px solid rgba(74,222,128,.3);
  box-shadow: 0 0 0 6px rgba(74,222,128,.15), 0 0 12px rgba(74,222,128,.5);
  animation: pulse-ring 2s ease-out infinite;
}
@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(74,222,128,.5), 0 0 12px rgba(74,222,128,.4); }
  70%  { box-shadow: 0 0 0 14px rgba(74,222,128,0), 0 0 12px rgba(74,222,128,.2); }
  100% { box-shadow: 0 0 0 0 rgba(74,222,128,0), 0 0 12px rgba(74,222,128,.3); }
}

/* Leaflet overrides */
.leaflet-container { background: #1a2035; }
.leaflet-control-zoom { border: 1px solid var(--border) !important; }
.leaflet-control-zoom a { background: rgba(26,34,52,.95) !important; color: var(--text) !important; border-color: var(--border) !important; }
.bus-stop-tooltip {
  background: rgba(11,15,28,.95) !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  color: #f0f6ff !important;
  font-size: 11px !important;
  font-family: 'Noto Sans JP', sans-serif !important;
  padding: 4px 8px !important;
  border-radius: 6px !important;
  box-shadow: 0 4px 12px rgba(0,0,0,.5) !important;
}
.bus-stop-tooltip::before { display: none !important; }

/* 地図凡例 */
.map-legend {
  position: absolute;
  bottom: 120px;
  right: 10px;
  z-index: 800;
  background: rgba(11,15,28,.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 10px;
  line-height: 1.8;
}
.legend-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
.legend-home {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #00d4ff;
  margin-right: 4px;
  vertical-align: middle;
  box-shadow: 0 0 4px #00d4ff88;
}
</style>
</head>
<body>
<div id="app">
  <!-- TOP 25% -->
  <div id="top-panel">
    <div class="header-strip">
      <div>
        <div class="stop-label">
          <span class="stop-name-big">八雲台</span>
          <span class="stop-ruby">YAKUMODAI</span>
        </div>
        <div class="day-chip" id="day-chip">平日ダイヤ</div>
      </div>
      <div style="text-align:right">
        <div class="clock-mono" id="clock">--:--:--</div>
      </div>
    </div>
    <div class="tab-row" id="tab-row">
      <div class="tab active-o" onclick="setDir(0)"><span class="op-chip co">小急</span>①吉祥寺</div>

      <div class="tab" onclick="setDir(3)"><span class="op-chip ck">京王</span>②調布</div>
    </div>
    <div class="next-bus-row">
      <div class="route-badge rb-odakyu" id="next-badge">吉１４</div>
      <div class="next-info">
        <div class="next-dest" id="next-dest">—</div>
        <div class="next-route" id="next-route">—</div>
      </div>
      <div class="next-countdown">
        <div class="cnt-num odakyu-col" id="cnt-num">--</div>
        <div class="cnt-unit" id="cnt-unit">分</div>
        <div class="cnt-depart" id="cnt-depart">--:--発</div>
      </div>
    </div>
  </div>

  <!-- MAP 75% -->
  <div id="map-wrap">
    <div id="map"></div>

    <div class="map-overlay-tl">
      <div class="map-pill">
        <div class="demo-dot"></div>
        <span>デモアニメ</span>
      </div>
    </div>

    <div class="map-legend">
      <div><span class="legend-home"></span>八雲台（現在のバス停）</div>
      <div><span class="legend-dot" style="background:#00d4ff"></span>京王バス停</div>
      <div><span class="legend-dot" style="background:#ff9500"></span>小田急バス停</div>
      <div><span class="legend-dot" style="background:#c084fc"></span>両社共通</div>
      <div><span class="legend-dot" style="background:#4ade80"></span>現在地</div>
    </div>

    <div id="bottom-sheet">
      <div class="upcoming-row" id="upcoming-row"></div>
    </div>
  </div>
</div>

function pad(n) { return String(n).padStart(2, '0'); }
function fmt(h, m) { return `${pad(h)}:${pad(m)}`; }
function dayType() { const w = new Date().getDay(); return w === 0 ? 'holiday' : w === 6 ? 'saturday' : 'weekday'; }
function dayLabel() { const w = new Date().getDay(); return w === 0 ? '日祝ダイヤ' : w === 6 ? '土曜' : '平日'; }

function isOdakyu(dir) { return dir <= 2; }
function accentColor(dir) { return isOdakyu(dir) ? 'var(--accent-odakyu)' : 'var(--accent-keio)'; }

function getSched(dir) {
  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
  return (TT[dir][dayType()] || [])
    .map(([h, m, r, d]) => ({ h, m, r, d, dep: h * 60 + m, diff: h * 60 + m - nm }))
    .filter(b => b.diff > -1)
    .sort((a, b) => a.dep - b.dep);
}

function getBadgeClass(route, dir) {
  if (dir <= 2) return route.includes('吉') ? 'rb-odakyu' : 'rb-red';
  return route.includes('調') ? 'rb-keio' : 'rb-green';
}

  userMarker = L.marker([userPos.lat, userPos.lng], { icon: youIcon }).addTo(map);

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      userMarker.setLatLng([userPos.lat, userPos.lng]);
    }, null, { enableHighAccuracy: true });
  }

  // OSMからバス停を取得・描画
  loadBusStopsFromOSM();
}

// =============================================
// ODPT APIでバス停を取得（京王・小田急）
// =============================================
const ODPT_TOKEN = 'ftvgdowhcnvsy5vjxu239lrq7tmua0p77c5wrgar2q11n2g87algpfd5h24mymiw';

async function loadBusStopsFromOSM() {
  const banner = document.getElementById('rt-banner');
  const dot    = document.getElementById('rt-dot');
  const status = document.getElementById('rt-status');
  banner.style.display = 'flex';
  banner.className = 'rt-banner rt-inactive';
  dot.className = 'rt-dot off';
  status.textContent = 'バス停データ読み込み中…';

  try {
    // 京王・小田急を並列取得。八雲台中心8km圏内
    // api.odpt.org/places はCORS対応済み・トークン必須
    // 京王・小田急を別々に、かつ半径を広げて全路線カバー
    const BASE = `https://api.odpt.org/api/v4/places/odpt:BusstopPole?acl:consumerKey=${ODPT_TOKEN}`;
    // 八雲台〜吉祥寺〜三鷹〜調布〜深大寺をカバーするため
    // 中心を少し北にずらし半径12kmに拡大
    const [keioRes, odakyuRes] = await Promise.all([
      fetch(`${BASE}&lat=35.675&lon=139.555&radius=12000&odpt:operator=odpt.Operator:KeioBus`),
      fetch(`${BASE}&lat=35.675&lon=139.555&radius=12000&odpt:operator=odpt.Operator:OdakyuBus`)
    ]);

    if (!keioRes.ok) throw new Error(`京王API: ${keioRes.status}`);
    if (!odakyuRes.ok) throw new Error(`小急API: ${odakyuRes.status}`);

    const keioStops   = await keioRes.json();
    const odakyuStops = await odakyuRes.json();

    renderBusStops(keioStops, 'keio');
    renderBusStops(odakyuStops, 'odakyu');

    const total = keioStops.length + odakyuStops.length;
    status.textContent = `京王${keioStops.length}件・小急${odakyuStops.length}件 取得完了`;
    banner.className = 'rt-banner rt-active';
    dot.className = 'rt-dot live';
    setTimeout(() => { banner.style.display = 'none'; }, 3000);

  } catch(e) {
    status.textContent = `取得失敗: ${e.message}`;
    banner.className = 'rt-banner rt-error';
    dot.className = 'rt-dot err';
    console.warn('ODPT error:', e);
  }
}

// =============================================
// バス停マーカー描画（ODPT形式）
// =============================================
function renderBusStops(stops, operator) {
  const col   = operator === 'keio' ? '#00d4ff' : '#ff9500';
  const label = operator === 'keio' ? '京王'    : '小急';

  // 重複排除用（同名バス停が上下線で2件ある）
  const seen = new Set();

  stops.forEach(s => {
    const lat  = s['geo:lat'];
    const lon  = s['geo:long'];
    const name = s['dc:title'] || s['owl:sameAs'] || '?';
    if (!lat || !lon) return;

    // 八雲台は特別マーカーで描画済みなのでスキップ
    if (name === '八雲台') return;

    // 同名・近接の重複スキップ（上下線・乗り場番号違い）55mグリッドで集約
    const nameKey = name.replace(/[０-９0-9]+$/, '');
    const posKey  = `${Math.round(lat*2000)}_${Math.round(lon*2000)}`;
    const key = `${nameKey}_${posKey}`;
    if (seen.has(key)) return;
    seen.add(key);

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:9px;height:9px;border-radius:50%;
        background:${col};
        border:1.5px solid rgba(255,255,255,0.4);
        box-shadow:0 0 5px ${col}99;
      "></div>`,
      iconSize: [9, 9],
      iconAnchor: [4.5, 4.5],
    });

    L.marker([lat, lon], { icon })
      .bindTooltip(`<b>${name}</b><br><span style="color:${col};font-size:10px">${label}バス</span>`, {
        permanent: false,
        direction: 'top',
        className: 'bus-stop-tooltip',
      })
      .addTo(map);
  });
}

// =============================================
// GTFS-RT リアルタイム車両位置（京王バス）
// Protobufをバイナリ手動パースして lat/lng を取得
// =============================================
async function fetchRTBuses() {
  try {
    const res = await fetch(GTFS_RT_URL);
    if (!res.ok) throw new Error(`status ${res.status}`);
    const buf = await res.arrayBuffer();
    const vehicles = parseGtfsRtVehicle(new Uint8Array(buf));
    renderRTBuses(vehicles);
    rtEnabled = true;
    // バナーをLIVEに
    document.getElementById('rt-dot').className = 'rt-dot live';
    document.getElementById('rt-status').textContent = `京王バス LIVE ${vehicles.length}台`;
    document.getElementById('rt-banner').className = 'rt-banner rt-active';
    document.getElementById('rt-banner').style.display = 'flex';
  } catch(e) {
    console.warn('GTFS-RT fetch失敗:', e.message);
  }
}

// GTFS-RT Protobuf 手動パーサ（VehiclePosition の lat/lng/vehicle_id を抽出）
function parseGtfsRtVehicle(bytes) {
  const vehicles = [];
  let i = 0;
  function readVarint() {
    let v = 0, s = 0;
    while (i < bytes.length) {
      const b = bytes[i++];
      v |= (b & 0x7f) << s;
      if (!(b & 0x80)) break;
      s += 7;
    }
    return v;
  }
  function readFixed32() {
    const v = new DataView(bytes.buffer, bytes.byteOffset + i, 4).getFloat32(0, true);
    i += 4; return v;
  }
  function skipField(type) {
    if (type === 0) readVarint();
    else if (type === 1) { i += 8; }
    else if (type === 2) { const len = readVarint(); i += len; }
    else if (type === 5) { i += 4; }
  }
  function parseMsg(end) {
    const obj = {};
    while (i < end) {
      const tag = readVarint();
      const field = tag >> 3, type = tag & 7;
      if (type === 2) {
        const len = readVarint();
        const sub = i; i += len;
        obj[field] = parseMsg(i); // 再帰
        i = sub + len; // 念のため
        // ※ネストが深いのでflatに上書きOK
        Object.assign(obj, obj[field]);
      } else if (type === 5 && (field === 3 || field === 4)) {
        // field 3=lat, 4=lng (VehiclePosition)
        const v = readFixed32();
        if (field === 3) obj.lat = v;
        else obj.lng = v;
      } else {
        skipField(type);
      }
    }
    return obj;
  }
  // FeedMessage → repeated FeedEntity (field=2)
  while (i < bytes.length) {
    const tag = readVarint();
    const field = tag >> 3, type = tag & 7;
    if (field === 2 && type === 2) {
      const len = readVarint();
      const end = i + len;
      const entity = parseMsg(end);
      i = end;
      if (entity.lat && entity.lng) {
        vehicles.push({ lat: entity.lat, lng: entity.lng });
      }
    } else {
      skipField(type);
    }
  }
  return vehicles;
}

function renderRTBuses(vehicles) {
  // 既存マーカー削除
  Object.values(rtBusMarkers).forEach(m => map.removeLayer(m));
  rtBusMarkers = {};

  vehicles.forEach((v, idx) => {
    if (!v.lat || !v.lng) return;
    const icon = L.divIcon({
      className: '',
      html: `<div style="
        background:#00d4ff;color:#000;
        font-size:16px;border-radius:50%;
        width:26px;height:26px;
        display:flex;align-items:center;justify-content:center;
        border:2px solid #fff;
        box-shadow:0 0 8px #00d4ff99;
      ">🚌</div>`,
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
    rtBusMarkers[idx] = L.marker([v.lat, v.lng], { icon, zIndexOffset: 300 })
      .bindTooltip('京王バス（リアルタイム）', { direction: 'top', className: 'bus-stop-tooltip' })
      .addTo(map);
  });
}

// =============================================
// バスアイコン更新
// =============================================
function makeBusIcon(route, dir, arriving) {
  const od = isOdakyu(dir);
  const cls = arriving ? 'arriving' : (od ? 'od' : '');
  return L.divIcon({
    className: '',
    html: `<div class="bus-icon-wrap">
      <div class="bus-icon-emoji">🚌</div>
      <div class="bus-icon-label ${cls}">${route}</div>
    </div>`,
    iconSize: [50, 44],
    iconAnchor: [25, 44],
  });
}

function updateBusMarker() {
  const sched = getSched(currentDir);
  if (!sched.length) {
    if (busMarker) { map.removeLayer(busMarker); busMarker = null; }
    return;
  }
  const next = sched[0];
  // デモ: 次のバスまでの時間に応じてバスを「遠い場所から近づかせる」
  const remMin = next.diff;
  // 0分→バス停、10分以上→遠い起点
  const t = Math.max(0, Math.min(1, 1 - remMin / 12));
  demoProgress = t;
  const origin = ROUTE_ORIGINS[currentDir] || ROUTE_ORIGINS[1];
  const lat = origin.lat + (STOP_POS.lat - origin.lat) * t;
  const lng = origin.lng + (STOP_POS.lng - origin.lng) * t;
  const arriving = remMin <= 2;
  const icon = makeBusIcon(next.r, currentDir, arriving);
  if (!busMarker) {
    busMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
  } else {
    busMarker.setLatLng([lat, lng]);
    busMarker.setIcon(icon);
  }
}

// =============================================
// デモ：バスをゆっくりスライドさせる（毎秒）
// =============================================
function animateDemoBus() {
  const sched = getSched(currentDir);
  if (!sched.length) return;
  const next = sched[0];
  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const depSec = next.h * 3600 + next.m * 60;
  const remSec = Math.max(0, depSec - nowSec);
  const totalSec = 12 * 60; // 12分をフルレンジとする
  const t = Math.max(0, Math.min(1, 1 - remSec / totalSec));
  const origin = ROUTE_ORIGINS[currentDir] || ROUTE_ORIGINS[1];
  const lat = origin.lat + (STOP_POS.lat - origin.lat) * t;
  const lng = origin.lng + (STOP_POS.lng - origin.lng) * t;
  const arriving = remSec <= 120;
  const icon = makeBusIcon(next.r, currentDir, arriving);
  if (!busMarker) {
    busMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
  } else {
    busMarker.setLatLng([lat, lng]);
    busMarker.setIcon(icon);
  }
}

// =============================================
// UI 更新
// =============================================
function updateUI() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('day-chip').textContent = dayLabel();

  const sched = getSched(currentDir);

  if (!sched.length) {
    document.getElementById('next-dest').textContent = '本日の運行終了';
    document.getElementById('next-route').textContent = '—';
    document.getElementById('cnt-num').textContent = '—';
    document.getElementById('cnt-depart').textContent = '';
    document.getElementById('upcoming-row').innerHTML = '';
    return;
  }

  const next = sched[0];
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const depSec = next.h * 3600 + next.m * 60;
  const remSec = Math.max(0, depSec - nowSec);
  const remMin = Math.floor(remSec / 60);
  const remS = remSec % 60;
  const od = isOdakyu(currentDir);
  const arriving = remSec <= 120;

  // badge
  const badge = document.getElementById('next-badge');
  badge.textContent = next.r;
  badge.className = `route-badge ${getBadgeClass(next.r, currentDir)}`;

  document.getElementById('next-dest').textContent = next.d;
  document.getElementById('next-route').textContent = `${next.r}系統`;

  // countdown
  const numEl = document.getElementById('cnt-num');
  numEl.className = `cnt-num ${arriving ? 'urgent-col' : od ? 'odakyu-col' : 'keio-col'}`;
  if (remSec <= 0) {
    numEl.textContent = 'まもなく';
    document.getElementById('cnt-unit').textContent = '';
  } else if (remMin === 0) {
    numEl.textContent = remS;
    document.getElementById('cnt-unit').textContent = '秒';
  } else {
    numEl.textContent = remMin;
    document.getElementById('cnt-unit').textContent = `分 ${pad(remS)}秒`;
  }
  document.getElementById('cnt-depart').textContent = `${fmt(next.h, next.m)}発`;

  // upcoming cards
  const upRow = document.getElementById('upcoming-row');
  upRow.innerHTML = sched.slice(1, 6).map(b => {
    const col = isOdakyu(currentDir) ? '#ff9500' : '#00d4ff';
    return `<div class="upcoming-card">
      <div class="uc-time" style="color:${col}">${fmt(b.h, b.m)}</div>
      <div class="uc-dest">${b.d}</div>
      <div class="uc-min" style="color:${col}">あと${b.diff}分</div>
    </div>`;
  }).join('');

  // デモバスアニメ
  animateDemoBus();
}

// =============================================
// タブ切替
// =============================================
function setDir(tabIdx) {
  currentDir = DIR_MAP[tabIdx];
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t, i) => {
    const od = i <= 1;
    t.className = 'tab' + (i === tabIdx ? (od ? ' active-o' : ' active-k') : '');
  });
  // バスマーカーをいったん消して再生成
  if (busMarker) { map.removeLayer(busMarker); busMarker = null; }
  // 地図の向きを少しずらす（のりばが左右にある）
  const offset = tabIdx <= 1 ? [0.0003, 0] : [-0.0003, 0];
  map.setView([STOP_POS.lat + offset[0], STOP_POS.lng + offset[1]], 16, { animate: true });
  updateUI();
}

// =============================================
// BOOT
// =============================================
window.addEventListener('load', () => {
  initMap();
  updateUI();
  setInterval(updateUI, 1000);
  // GTFS-RT: 起動後2秒で初回取得、以降30秒ごと
  setTimeout(() => {
    fetchRTBuses();
    setInterval(fetchRTBuses, 30000);
  }, 2000);
});
</script>
